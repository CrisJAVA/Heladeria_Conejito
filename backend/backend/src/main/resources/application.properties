spring.application.name=backend

# ============================================================
# PostgreSQL - Base de datos principal
# ============================================================
# Asegúrate de tener PostgreSQL corriendo y la BD creada:
#   CREATE DATABASE heladeria_conejito;
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/heladeria_conejito}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:180706}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# Datos iniciales (admin, categorías, etc.) se cargan
# automáticamente desde config/DataInitializer.java
# ============================================================

# ============================================================
# Configuración de desarrollo adicional
# ============================================================
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:HeladeriaConejito2025SecretKeySuperSeguraParaFirmarJWTToken}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File upload
upload.dir=${UPLOAD_DIR:uploads}
spring.web.resources.static-locations=file:${UPLOAD_DIR:uploads}/,classpath:/static/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.heladeria=${LOG_LEVEL:INFO}
