spring.application.name=backend

# ============================================================
# PostgreSQL - Base de datos principal
# ============================================================
# Asegúrate de tener PostgreSQL corriendo y la BD creada:
#   CREATE DATABASE heladeria_conejito;
spring.datasource.url=jdbc:postgresql://localhost:5432/heladeria_conejito
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================================================
# Para cargar datos iniciales desde schema.sql:
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:schema.sql
# spring.jpa.defer-datasource-initialization=true
# ============================================================

# ============================================================
# Configuración de desarrollo adicional
# ============================================================
server.port=8080

# Logging
logging.level.com.heladeria=INFO
