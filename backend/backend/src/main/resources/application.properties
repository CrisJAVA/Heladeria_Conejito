spring.application.name=backend

# ============================================================
# H2 Database Configuration (Archivo persistente)
# ============================================================
# Los datos se guardan en database/data/heladeria
# Puedes acceder a la consola H2 en: /h2-console
# JDBC URL: jdbc:h2:file:./database/data/heladeria
spring.datasource.url=jdbc:h2:file:./database/data/heladeria;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (accesible en /h2-console mientras dure el desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

