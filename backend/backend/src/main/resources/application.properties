spring.application.name=backend

# ============================================================
# PostgreSQL - Base de datos principal
# ============================================================
# Asegúrate de tener PostgreSQL corriendo y la BD creada:
#   CREATE DATABASE heladeria_conejito;
spring.datasource.url=jdbc:postgresql://localhost:5432/heladeria_conejito
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=adminroot123

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================================================
# Datos iniciales (admin, categorías, etc.) se cargan
# automáticamente desde config/DataInitializer.java
# ============================================================

# ============================================================
# Configuración de desarrollo adicional
# ============================================================
server.port=8080

# JWT
jwt.secret=HeladeriaConejito2025SecretKeySuperSeguraParaFirmarJWTToken
jwt.expiration=86400000

# File upload
upload.dir=uploads
spring.web.resources.static-locations=file:uploads/,classpath:/static/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.heladeria=INFO
