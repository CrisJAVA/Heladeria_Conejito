services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: heladeria_conejito
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-180706}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/heladeria_conejito
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-180706}
      JWT_SECRET: ${JWT_SECRET:-HeladeriaConejito2025SecretKeySuperSeguraParaFirmarJWTToken}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
