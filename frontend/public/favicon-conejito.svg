<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#ffd93d"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a87c"/>
      <stop offset="100%" stop-color="#d4885a"/>
    </linearGradient>
  </defs>
  <!-- fondo redondo -->
  <circle cx="64" cy="64" r="62" fill="url(#bg)"/>
  <!-- orejas -->
  <ellipse cx="40" cy="30" rx="10" ry="22" fill="white" transform="rotate(-15 40 30)"/>
  <ellipse cx="88" cy="30" rx="10" ry="22" fill="white" transform="rotate(15 88 30)"/>
  <ellipse cx="41" cy="32" rx="5" ry="14" fill="#ffb3c6" transform="rotate(-15 41 32)"/>
  <ellipse cx="87" cy="32" rx="5" ry="14" fill="#ffb3c6" transform="rotate(15 87 32)"/>
  <!-- cabeza -->
  <circle cx="64" cy="62" r="28" fill="white"/>
  <!-- ojos -->
  <circle cx="54" cy="58" r="4" fill="#2d2d2d"/>
  <circle cx="74" cy="58" r="4" fill="#2d2d2d"/>
  <circle cx="55" cy="56" r="1.5" fill="white"/>
  <circle cx="75" cy="56" r="1.5" fill="white"/>
  <!-- nariz -->
