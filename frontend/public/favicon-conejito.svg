  <line x1="42" y1="68" x2="52" y2="67" stroke="#2d2d2d" stroke-width="1" stroke-linecap="round"/>
  <line x1="86" y1="63" x2="76" y2="65" stroke="#2d2d2d" stroke-width="1" stroke-linecap="round"/>
  <line x1="86" y1="68" x2="76" y2="67" stroke="#2d2d2d" stroke-width="1" stroke-linecap="round"/>
  <!-- cono -->
  <path d="M52 86 L64 118 L76 86 Z" fill="url(#cone)"/>
  <!-- lineas del cono -->
  <line x1="64" y1="86" x2="64" y2="118" stroke="#c47a4a" stroke-width="1" opacity="0.5"/>
  <line x1="58" y1="90" x2="60" y2="108" stroke="#c47a4a" stroke-width="1" opacity="0.3"/>
  <line x1="70" y1="90" x2="68" y2="108" stroke="#c47a4a" stroke-width="1" opacity="0.3"/>
